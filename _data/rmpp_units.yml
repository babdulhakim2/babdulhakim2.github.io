- unit_number: "12"
  title: "Unit 12: Project Management and Managing Risk"
  description: "Project management methodologies, risk assessment, and change management processes for computing projects"
  content: |
    <h4>12.1 Key Concepts</h4>
    <ul>
      <li><strong>Project Management:</strong> Controlling processes and activities related to computing infrastructure and information systems projects</li>
      <li><strong>Project Life Cycles:</strong> Structured phases and methodologies for project implementation</li>
      <li><strong>Risk Management:</strong> Identifying, assessing, and mitigating project risks and uncertainties</li>
      <li><strong>Change Control:</strong> Managing inevitable project changes while maintaining scope, quality, and timelines</li>
      <li><strong>Remote Collaboration:</strong> Technologies and software supporting distributed project teams</li>
    </ul>

    <h4>12.2 Learning Outcomes</h4>
    <ul>
      <li>Define and explain project management concepts and their application to computing projects</li>
      <li>Demonstrate appreciation of project life cycles and methodologies</li>
      <li>Understand how projects are impacted by risk and uncertainty</li>
      <li>Prepare comprehensive risk management plans</li>
      <li>Appreciate technologies supporting remote collaboration</li>
      <li>Control risk and manage project change effectively</li>
    </ul>

    <h4>12.3 Reflection Notes</h4>
    <p>The complexity of computing projects necessitates structured project management approaches, as no 'one size fits all' methodology exists (Nicholas & Steyn, 2020). The PMBOK Guide's emphasis on project uniqueness aligns with the diverse environments and objectives encountered in computing infrastructure projects. Risk-free projects are non-existent, making proactive risk identification crucial for project success.</p>

    <p>Chapman's (2019) maturity model highlights that effective risk management enhances project capability through systematic deployment of assessment frameworks. The integration of Agile methodologies (Mircea, 2019) with traditional project management provides flexibility essential for managing software development uncertainties. McKinsey's (2022) AI status report demonstrates how technological advancement creates both opportunities and risks requiring adaptive project management approaches.</p>
  references: |
    <ol>
      <li>Nicholas, J.M. and Steyn, H., (2020) Project management for engineering, business and technology. Routledge. Chapters 1, 3, 5, and 10</li>
      <li>Project Management Institute. (2020) A Guide to the Project Management Body of Knowledge PMBOK Guide, 7th Edition. Newtown Square, PA: Project Management Institute</li>
      <li>Mircea, E. (2019) Project Management using Agile Frameworks</li>
      <li>McManus, J. (2004) Risk Management in Software Development and Software Engineering Projects</li>
      <li>The Association for Project Management (APM). (2023) What is a Gantt Chart?</li>
      <li>McKinsey. (2023) The Status of AI in 2022</li>
      <li>Successful projects. (no date) Project Management Methodologies</li>
      <li>Chapman, R. (2019) 'Exploring the Value of Risk Management for Projects: Improving Capability Through the Deployment of a Maturity Model', IEEE Engineering Management Review, 47(1), pp. 126-143</li>
    </ol>
  artifacts: []
