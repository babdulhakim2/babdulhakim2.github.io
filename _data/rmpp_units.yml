# Research Methods and Professional Practice Units Data
# This file contains all the information for RMPP units to be displayed on the site

- unit_number: "1-3"
  title: "Collaborative Discussion 1: Codes of Ethics and Professional Conduct"
  description: "Three-week discussion analyzing ACM case studies through professional ethical frameworks and comparing with BCS Code of Conduct"
  content: |
    <h4>1-3.1 Key Concepts</h4>
    <ul>
      <li><strong>Professional Codes:</strong> ACM Code of Ethics and BCS Code of Conduct application</li>
      <li><strong>Case Study Analysis:</strong> Real-world ethical scenarios from ACM examples</li>
      <li><strong>Legal and Social Impact:</strong> Jurisdictional and professional implications</li>
      <li><strong>Comparative Ethics:</strong> ACM versus BCS code frameworks</li>
    </ul>

    <h4>1-3.2 Learning Outcomes</h4>
    <ul>
      <li>Appraise the professional, legal, social, cultural and ethical issues that affect computing professionals</li>
    </ul>

    <h4>1-3.3 Reflection Notes</h4>
    <p>The discussion examined AllTogether's accessibility failure case study, revealing tensions between delivery pressure and ethical compliance. Peer feedback emphasized integrating preventive measures into development processes, highlighting accessibility as fundamental professional competence (Gotterbarn et al., 2018). The analysis demonstrated how ACM and BCS codes address professional competence differently, with BCS emphasizing jurisdictional legal compliance while ACM focuses on broader public welfare principles (Wong, 2021).</p>
  references: |
    <ol>
      <li>Gotterbarn, D., Wolf, M.J. and Flick, C. (2018) 'ACM Code of Ethics', Communications of the ACM, 61(1), pp. 121–128</li>
      <li>Wong, R.Y. (2021) 'Tactics of soft resistance in user experience professionals' values work', Proceedings of the ACM on Human-Computer Interaction, 5(CSCW2), pp. 1-28</li>
      <li>Gautam, A. et al. (2024) 'Socially responsible computing in an introductory course', Proceedings of the 55th ACM Technical Symposium on Computer Science Education, pp. 373-379</li>
    </ol>
  artifacts:
    - title: "Initial Post and Peer Responses"
      url: "/rmpp/unit1-3/"
      description: "Ethical analysis of accessibility failures with peer feedback and professional code application"

- unit_number: "1"
  title: "Unit 1: Introduction to Research Methods - The Scientific Investigation and Ethics in Computing"
  description: "Scientific method, deductive/inductive reasoning, and ethical frameworks for computing research and professional practice"
  content: |
    <h4>1.1 Key Concepts</h4>
    <ul>
      <li><strong>Scientific Method:</strong> Observation, hypothesis, reasoning and testing approaches</li>
      <li><strong>Deductive Reasoning:</strong> Theory to observation to conclusion methodology</li>
      <li><strong>Inductive Reasoning:</strong> Observation to analysis to theory development</li>
      <li><strong>Research Ethics:</strong> Menlo Report principles (Respect, Beneficence, Justice, Law and Public Interest)</li>
      <li><strong>Professional Conduct:</strong> BCS and ACM codes for computing professionals</li>
    </ul>

    <h4>1.2 Learning Outcomes</h4>
    <ul>
      <li>Differentiate between inductive and deductive reasoning</li>
      <li>Understand why ethics are important and how they relate to research and professional practice</li>
    </ul>

    <h4>1.3 Reflection Notes</h4>
    <p>The scientific method's combination of observation, hypothesis, reasoning and testing varies significantly across disciplines, with deductive and inductive reasoning serving as core problem-solving approaches (Anderson & Hepburn, 2020). Deductive reasoning provides perfect conclusions when assumptions are correct, while inductive reasoning proves more practical for everyday problems involving partial information.</p>

    <p>Research ethics in computing extends beyond traditional frameworks through the Menlo Report's four principles, particularly relevant in the generative AI age where additional moral considerations emerge (Finn & Shilton, 2023; Deckard, 2023). The distinction between ethics and morals becomes crucial for computing professionals navigating complex technological impacts on society.</p>
  references: |
    <ol>
      <li>Anderson, H. and Hepburn, B. (2020) 'Scientific Method', The Stanford Encyclopedia of Philosophy (Winter 2020 edition)</li>
      <li>Finn, M. and Shilton, K. (2023) 'Ethics governance development: The case of the Menlo Report', Social Studies of Science, 53(3), pp. 315-340</li>
      <li>Deckard, R. (2023) What are Ethics in AI</li>
      <li>Dawson, C. (2015) Projects in Computing and Information Systems: A Student's Guide, Chapters 2</li>
      <li>Correa, N. et al. (2023) Worldwide AI ethics: A review of 200 guidelines and recommendations for AI governance</li>
    </ol>
  artifacts:
    - title: "Reflective Activity 1: Ethics in Computing in the Age of Generative AI"
      description: "Global AI Ethics Landscape: Challenges and Recommendations"
      url: "/rmpp/unit1-ethics/"

- unit_number: "2"
  title: "Unit 2: Research Questions, the Literature Review and the Research Proposal"
  description: "Research question formulation, literature review methodology, and research proposal development"
  content: |
    <h4>2.1 Key Concepts</h4>
    <ul>
      <li>Formulating and revising research questions</li>
      <li>Research proposal structure and components</li>
      <li>Literature review process and presentation</li>
      <li>Critical evaluation of literature</li>
    </ul>

    <h4>2.2 Learning Outcomes</h4>
    <ul>
      <li>Examine characteristics that make up suitable research topics</li>
      <li>Explore rational and creative methods for formulating research ideas</li>
      <li>Identify means of transforming research ideas into crafted research questions and proposals</li>
      <li>Conduct literature searches, critique literature and present literature reviews</li>
    </ul>

    <h4>2.3 Reflection Notes</h4>
    <p>The process of defining research topics proved "daunting" as Boza (2022) notes, requiring careful question formulation and revision. My chosen topic <strong>"Evaluating the Impact of Large Language Models on Authorised Push Payment Fraud Detection and Prevention in the UK"</strong> emerged from my financial crime background. The literature review process involved systematic searching and critical evaluation of scholarly sources to identify gaps in existing research (Dawson, 2015).</p>
  references: |
    <ol>
      <li>Dawson, C. (2015) Projects in Computing and Information Systems: A Student's Guide, Chapters 1-3, 5</li>
      <li>Boza, T. (2022) How to Write a Literature Review: Six Steps to Get You from Start to Finish</li>
      <li>Healey, M., Matthews, K. and Cook-Sather, A. (2020) Writing about learning and teaching in higher education, Chapter 14</li>
      <li>Kuziemsky, C. and Lau, F. (2016) Handbook of eHealth Evaluation An Evidence-based Approach, Chapter 9</li>
    </ol>

- unit_number: "3"
  title: "Unit 3: Methodology and Research Methods"
  description: "Introduction to research methodology, design types, and data collection methods"
  content: |
    <h4>3.1 Key Concepts</h4>
    <ul>
      <li>Exploratory vs Descriptive research designs</li>
      <li>Qualitative, Quantitative, and Mixed Methods research</li>
      <li>Primary and Secondary research approaches</li>
      <li>Interview and survey design techniques</li>
    </ul>

    <h4>3.2 Learning Outcomes</h4>
    <ul>
      <li>Understand the different research methods</li>
      <li>Know which data collection methods are related to each method of research</li>
      <li>Have some idea which of these would be suited to your area of research</li>
    </ul>

    <h4>3.3 Reflection Notes</h4>
    <p>The distinction between exploratory and descriptive research designs provided clarity for project planning. Understanding qualitative, quantitative, and mixed methods approaches helped determine appropriate data collection strategies. The lecturecast on interview and survey design proved particularly valuable, demonstrating how methodological choices impact research validity (Saunders et al., 2012).</p>
  references: |
