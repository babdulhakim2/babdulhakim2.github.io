- unit_number: "1"
  title: "Unit 1: Introduction to Research Methods"
  description: "Foundational concepts in research methodology and professional practice"
  content: |
    <h4>1.1 Key Concepts</h4>
    <p>This unit introduces fundamental research concepts:</p>
    <ul>
      <li><strong>Research Paradigms:</strong> Quantitative, qualitative, and mixed methods approaches</li>
      <li><strong>Ethics in Computing:</strong> Principles governing responsible research and practice</li>
      <li><strong>Literature Review:</strong> Systematic examination of existing research</li>
      <li><strong>Research Proposal:</strong> Structure and components of effective research proposals</li>
    </ul>

    <h4>1.2 Learning Outcomes</h4>
    <p>Key outcomes from this unit include:</p>
    <ul>
      <li>Understanding different research methodologies and their applications</li>
      <li>Recognizing ethical considerations in computing research</li>
      <li>Developing skills in literature review and proposal writing</li>
      <li>Applying research principles to computing contexts</li>
    </ul>

    <h4>1.3 Reflection Notes</h4>
    <p>Research methodology provides the foundation for systematic inquiry in computing fields. The choice between quantitative and qualitative approaches depends on the research questions and the nature of the phenomenon being investigated.</p>

    <p>Ethics in computing research extends beyond traditional research ethics to include considerations of data privacy, algorithmic bias, and the societal impact of technological innovations. These considerations are increasingly important as computing systems become more pervasive in society.</p>
  references: |
    <ol>
      <li>Research methodology foundations and principles</li>
      <li>Ethics in computing research and practice</li>
    </ol>
  artifacts:
    - title: "Reasoning Quiz"
      description: "Assessment of reasoning and research fundamentals"
      url: "/rmpp/unit1-quiz/"
    - title: "Reflective Activity 1: Ethics in Computing in the Age of Generative AI"
      description: "Comprehensive analysis of ethical frameworks and novel solutions for computing professionals navigating generative AI challenges"
      url: "/rmpp/unit1-ethics/"

- unit_number: "2"
  title: "Unit 2: Literature Review Methodology"
  description: "Advanced techniques for conducting systematic literature reviews and developing research proposals"
  content: |
    <h4>2.1 Key Concepts</h4>
    <ul>
      <li><strong>Systematic Literature Review:</strong> Structured approach to reviewing existing research</li>
      <li><strong>Research Databases:</strong> Academic sources and search strategies</li>
      <li><strong>Citation Management:</strong> Tools and techniques for managing references</li>
      <li><strong>Critical Analysis:</strong> Evaluating research quality and relevance</li>
    </ul>

    <h4>2.2 Learning Outcomes</h4>
    <ul>
      <li>Conducting systematic literature searches</li>
      <li>Critically evaluating research publications</li>
      <li>Synthesizing findings from multiple sources</li>
      <li>Developing research proposal outlines</li>
    </ul>

    <h4>2.3 Reflection Notes</h4>
    <p>Effective literature review requires both breadth and depth. The systematic approach ensures comprehensive coverage while maintaining focus on research objectives. Digital tools and databases have transformed the literature review process, enabling more efficient searching and analysis.</p>
  references: |
    <ol>
      <li>Systematic literature review methodologies</li>
      <li>Research database best practices</li>
    </ol>
  artifacts:
    - title: "e-Portfolio Activity: Literature Review and Research Proposal Outlines"
      description: "Development of literature review techniques and proposal structure"
      url: "/rmpp/unit2-literature/"

