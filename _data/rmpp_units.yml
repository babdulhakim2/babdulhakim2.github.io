      <li>Saunders, M., Lewis, P. and Thornhill, A. (2012) Research Methods for Business Students, 6th edn, Chapter 5</li>
      <li>Dawson, C. (2015) Projects in Computing and Information Systems: A Student's Guide, Chapter 2</li>
      <li>British Research Methodology (BRM) (2018) Research Design</li>
      <li>Sage (2021) Sage Research Methods: Methods Map</li>
    </ol>
  artifacts:
    - title: "e-Portfolio Activity: Research Proposal Review"
      description: "Methodology selection and data collection planning for chosen research area"
