    <h4>5.3 Reflection Notes</h4>
    <p>The questionnaire design process from deciding information required through pretesting proved invaluable for research planning. Analyzing inappropriate survey use cases like Cambridge Analytica highlighted ethical implications of data collection methods. Understanding the distinction between surveys and questionnaires, plus opening/closing question techniques, enhanced methodological awareness (Dawson, 2015).</p>
