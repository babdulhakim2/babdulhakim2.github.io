- unit_number: "4"
  title: "Unit 4: Case Studies, Focus Groups and Observations"
  description: "Data collection methods for qualitative research including case studies, focus groups, and observation techniques"
  content: |
    <h4>4.1 Key Concepts</h4>
    <ul>
      <li>Case study methodology and applications</li>
      <li>Focus group design and facilitation</li>
      <li>Quantitative vs Qualitative observation methods</li>
      <li>Observer roles and participant interaction</li>
    </ul>

    <h4>4.2 Learning Outcomes</h4>
    <ul>
      <li>Understand how to carry out each of these data collection methods</li>
      <li>Know which method would be suitable, if any, for your investigation</li>
      <li>Consider the type of data you would obtain</li>
    </ul>

    <h4>4.3 Reflection Notes</h4>
    <p>Learning about case studies, focus groups, and observation methods expanded my understanding of qualitative data collection. The distinction between quantitative observation (numerical values) and qualitative observation (monitoring characteristics) proved particularly useful. Understanding observer roles from complete observer to full participant highlighted the methodological considerations needed for valid research design (Dawson, 2015).</p>
  references: |
    <ol>
      <li>Dawson, C. (2015) Projects in Computing and Information Systems: A Student's Guide, Chapter 2</li>
      <li>Priya, A. (2021) 'Case Study Methodology of Qualitative Research: Key Attributes and Navigating the Conundrums in Its Application', Sociological bulletin, 70(1), pp. 94–110</li>
      <li>Kaplan, B. and Maxwell, J. A. Qualitative Research Methods for Evaluating Computer Information Systems</li>
      <li>Wohlin, C. (2021) Case Study Research in Software Engineering, Information and Software Technology</li>
    </ol>

- unit_number: "5"
  title: "Unit 5: Interviews, Survey Methods, and Questionnaire Design"
  description: "Interview techniques, survey methodology, questionnaire design, and pre-/post-testing methods"
  content: |
    <h4>5.1 Key Concepts</h4>
    <ul>
      <li>Interview methods and techniques</li>
      <li>Survey vs questionnaire distinctions</li>
      <li>Questionnaire design process and question types</li>
      <li>Pre-testing and post-testing methods</li>
    </ul>

    <h4>5.2 Learning Outcomes</h4>
    <ul>
      <li>Understand how interviews and surveys fit into research and whether either or both of these might be useful for your investigation</li>
