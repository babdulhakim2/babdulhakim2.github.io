- unit_number: "6"
  title: "Unit 6: Quantitative Methods - Descriptive and Inferential Statistics"
  description: "Introduction to quantitative analysis, descriptive statistics, and measures of location and spread"
  content: |
    <h4>6.1 Key Concepts</h4>
    <ul>
      <li>Quantitative data and levels of measurement</li>
      <li>Descriptive statistics and data summarization</li>
      <li>Measures of location (central tendency)</li>
      <li>Measures of dispersion (spread and variability)</li>
    </ul>

    <h4>6.2 Learning Outcomes</h4>
    <ul>
      <li>Understand and apply descriptive statistics</li>
      <li>Identify the different levels of measurement</li>
      <li>Produce measures of location and spread</li>
    </ul>

    <h4>6.3 Reflection Notes</h4>
    <p>Understanding quantitative methods proved fundamental for meaningful data analysis. Learning to distinguish between levels of measurement—nominal, ordinal, interval, and ratio—guides appropriate statistical technique selection. The progression from raw datasets to meaningful summary measures through descriptive statistics revealed how location and dispersion measures work together to characterize data distributions (Berenson et al., 2019).</p>
  references: |
    <ol>
      <li>Berenson, L., Levine, D., and Szabat, K. (2019) Basic Business Statistics: Concepts and Applications, 14th edn, Pearson, Chapters 2-3</li>
    </ol>

