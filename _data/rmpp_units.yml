- unit_number: "9"
  title: "Unit 9: Validity and Generalisability in Research"
  description: "Validity, generalisability, and reliability considerations in research design and data presentation"
  content: |
    <h4>9.1 Key Concepts</h4>
    <ul>
      <li><strong>Validity:</strong> Measurement targeting the correct construct</li>
      <li><strong>Reliability:</strong> Consistency of measurement processes</li>
      <li><strong>Generalisability:</strong> Applicability of findings to broader populations</li>
      <li><strong>Data Cleansing:</strong> Validation processes before analysis</li>
      <li><strong>Qualitative vs Quantitative:</strong> Analysis and presentation differences</li>
    </ul>

    <h4>9.2 Learning Outcomes</h4>
    <ul>
      <li>Understand how validity, generalisability, and reliability affect research design</li>
      <li>Distinguish between qualitative and quantitative data analysis approaches</li>
      <li>Apply data cleansing and validation processes before analysis</li>
      <li>Consider how results enable answering research questions</li>
    </ul>

    <h4>9.3 Reflection Notes</h4>
    <p>I initially underestimated how reliability must be established before validity can even be assessed. Working through the concepts, I realized that my previous research approaches often jumped to validity concerns without ensuring measurement consistency first. The lecturecast clarified how qualitative data interpretation differs fundamentally from quantitative analysis - something I hadn't fully appreciated when designing my research proposal on RL explainability. This unit made me reconsider my data collection timeline, as Saunders et al. (2023) emphasize that cleansing and validation processes need planning before any data gathering begins.</p>
  references: |
    <ol>
      <li>Schneider, C. (2018) Making the case: A Qualitative Approach to Studying Social Media Documents, in Bryman, A. & Buchanan, D. (eds.) Unconventional Methodology in Organization and Management Research. Oxford Scholarship Online</li>
      <li>Saunders, M., Lewis, P. and Thornhill, A. (2023) Research Methods for Business Students, 9th edn, Pearson, Chapter 11.4</li>
    </ol>
  artifacts:
    - title: "e-Portfolio Activity: Charts Worksheet"
      description: "Data visualization exercises with solutions for bar charts, histograms, and clustered columns"
      url: "/rmpp/unit9-charts/"

